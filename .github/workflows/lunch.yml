name: Lunch menus
on:
  schedule:
    # One successful run fetches the whole week, so the runs cluster where the new week
    # actually appears instead of spreading evenly. Once every restaurant is in, a run makes
    # no requests at all; the cost is only paid while something is still missing. Times are
    # UTC and off the full hour, where GitHub delays/drops runs most.
    # Sunday evening, 18.17 + 21.17 Helsinki: the new week usually lands here.
    - cron: '17 15,18 * * 0'
    # One run per weekday, to top up whatever Sunday did not get. Nothing waits on a precise
    # time: the page and the feed both carry every day that has been scraped, so a run is
    # early or late, never wrong. Piling on crons would buy nothing anyway — observed here,
    # these runs land 2–7 hours after their cron and a morning's crons collapse into one.
    - cron: '17 4 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: lunch
  cancel-in-progress: false

jobs:
  lunch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch today's menus
        run: python3 .github/lunch/fetch.py

      - name: Commit if changed
        run: |
          git add products/lunch
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "lunch: $(TZ=Europe/Helsinki date +'%-d.%-m. %H.%M')"
          git pull --rebase
          git push
