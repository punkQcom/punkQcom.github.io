name: Lunch menus
on:
  schedule:
    # Fetches TOMORROW's menus, so GitHub's late runs don't matter. Every 30 min Sun–Thu,
    # 12–21 Helsinki in summer, 11–20 in winter (cron is UTC: 09–18). Off the full hour, where
    # GitHub delays/drops runs most. Extra runs are harmless: fetch.py exits without changes
    # once all of tomorrow's menus are found.
    - cron: '17,47 9-18 * * 0-4'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: lunch
  cancel-in-progress: false

jobs:
  lunch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch today's menus
        run: python3 .github/lunch/fetch.py

      - name: Commit if changed
        run: |
          git add products/lunch
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "lunch: $(TZ=Europe/Helsinki date +'%-d.%-m. %H.%M')"
          git pull --rebase
          git push
