name: Lunch menus
on:
  schedule:
    # fetch.py tops up BOTH today and tomorrow on every run, so it no longer matters when
    # GitHub actually fires (observed: anywhere from 21.00 to 03.00 to 13.30). Every day, so
    # Sunday evening can prefetch Monday. Runs are no-ops once both days are complete, and
    # off the full hour, where GitHub delays/drops runs most.
    # Dense 06–12 Helsinki: catches a list published late on the morning it applies.
    - cron: '17,47 3-9 * * *'
    # Hourly for the rest of the day: picks up tomorrow's lists as they appear.
    - cron: '17 10-20 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: lunch
  cancel-in-progress: false

jobs:
  lunch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch today's menus
        run: python3 .github/lunch/fetch.py

      - name: Commit if changed
        run: |
          git add products/lunch
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "lunch: $(TZ=Europe/Helsinki date +'%-d.%-m. %H.%M')"
          git pull --rebase
          git push
