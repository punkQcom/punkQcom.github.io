name: Lunch menus
on:
  schedule:
    # GitHub delays scheduled runs by up to ~6 h, so start 6 h early: hourly from 21 UTC the
    # evening before (Sun–Thu) until 08 UTC. fetch.py uses Helsinki date, skips weekends, and
    # exits without changes once all menus are found, so extra/early runs are harmless.
    - cron: '0 21-23 * * 0-4'
    - cron: '0 0-8 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: lunch
  cancel-in-progress: false

jobs:
  lunch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch today's menus
        run: python3 .github/lunch/fetch.py

      - name: Commit if changed
        run: |
          git add products/lunch
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "lunch: $(TZ=Europe/Helsinki date +'%-d.%-m. %H.%M')"
          git pull --rebase
          git push
