<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>BettingPro — Sports Betting Calculator</title>
  <link rel="stylesheet" href="css/style.css?v=1787772315">
</head>
<body>
  <div class="container">
    <header>
      <div id="lang-switch" class="lang-switch" role="group" aria-label="Language / Kieli">
        <button type="button" data-lang="fi"><span class="flag" aria-hidden="true">🇫🇮</span> FI</button>
        <button type="button" data-lang="en"><span class="flag" aria-hidden="true">🇬🇧</span> EN</button>
      </div>
      <h1><a href="./" class="app-title-link">BettingPro</a> <button type="button" class="help-tip" data-help="about">?</button></h1>
      <p class="subtitle" data-i18n="nav.subtitle">Sports Betting Probability Calculator</p>
      <span id="last-update" class="last-update"></span>
    </header>

    <!-- Selector Bar -->
    <section class="card selector-bar">
      <div class="selector-row">
        <label><span data-i18n="sel.sport">Sport</span>
          <select id="sport-select"></select>
        </label>
        <label><span data-i18n="sel.league">League</span>
          <span class="input-row">
            <select id="league-select"></select>
            <button type="button" class="help-tip" data-help="league_mens_international">?</button>
          </span>
        </label>
        <label class="season-label"><span data-i18n="sel.season">Season</span>
          <select id="season-select"></select>
        </label>
        <label><span data-i18n="sel.bookmaker">Bookmaker</span>
          <select id="bookmaker-select">
            <option value="veikkaus">Veikkaus</option>
          </select>
        </label>
        <div class="season-only-bar">
          <span class="season-only-label"><span data-i18n="sel.currentSeasonOnly">Current Season Only</span> <button type="button" class="help-tip" data-help="season-only">?</button></span>
          <label class="season-only-toggle">
            <input type="checkbox" id="bar-season-only" checked>
            <span class="toggle-switch"></span>
          </label>
        </div>
      </div>
    </section>

    <!-- Tournament Filter (internationals only) -->
    <div id="tournament-filter" class="tournament-filter" hidden></div>

    <!-- Match List -->
    <section class="card">
      <h2><span data-i18n="sec.matches">Matches</span> <button type="button" class="help-tip" data-help="matches">?</button></h2>
      <div id="match-list" class="match-list">
        <p class="muted" data-i18n="list.loading">Loading...</p>
      </div>
    </section>

    <!-- Results (hidden until match clicked) -->
    <div id="results" class="results hidden">

      <!-- Floating Model Sliders -->
      <div id="slider-panel" class="slider-panel">
        <div class="slider-panel-header">
          <span class="slider-panel-title" data-i18n="panel.model">Model</span>
          <button id="slider-panel-reset" class="slider-panel-reset" data-i18n="panel.reset">Reset</button>
          <button id="slider-panel-toggle" class="slider-panel-toggle" aria-label="Collapse model sliders">&#9660;</button>
          <button id="slider-panel-close" class="slider-panel-close" aria-label="Close model panel">&times;</button>
        </div>
        <div id="slider-panel-body" class="slider-panel-body">
          <div class="slider-panel-grid">
            <div class="slider-panel-item">
              <label><span data-i18n="set.marketTrustShort">Market Trust</span>: <span id="fp-market-trust-value">--</span> <button type="button" class="help-tip" data-help="market-trust">?</button></label>
              <input type="range" id="fp-market-trust-slider" min="0" max="100" step="1" value="50">
            </div>
            <div class="slider-panel-item">
              <label><span data-i18n="set.lowScoreCorrShort">Low-Score Corr</span>: <span id="fp-rho-value">-0.13</span> <button type="button" class="help-tip" data-help="rho">?</button></label>
              <input type="range" id="fp-rho-slider" min="-0.30" max="0" step="0.01" value="-0.13">
            </div>
            <div class="slider-panel-item">
              <label><span data-i18n="set.formBoost">Form Boost</span>: <span id="fp-form-boost-value">3%</span> <button type="button" class="help-tip" data-help="form-boost">?</button></label>
              <input type="range" id="fp-form-boost-slider" min="0" max="5" step="1" value="3">
            </div>
            <div class="slider-panel-item">
              <label><span data-i18n="set.bayesianPrior">Bayesian Prior</span>: <span id="fp-prior-weight-value">5</span> <button type="button" class="help-tip" data-help="prior-weight">?</button></label>
              <input type="range" id="fp-prior-weight-slider" min="0" max="15" step="1" value="5">
            </div>
            <div class="slider-panel-item">
              <label><span data-i18n="set.prevSeasonShort">Prev Season</span>: <span id="fp-prev-season-value">--</span> <button type="button" class="help-tip" data-help="prev-season">?</button></label>
              <input type="range" id="fp-prev-season-slider" min="0" max="100" step="1" value="50">
            </div>
            <div class="slider-panel-item slider-panel-toggle-item">
              <label class="slider-panel-override">
                <input type="checkbox" id="fp-season-only" checked>
                <span class="toggle-switch"></span>
                <span class="toggle-label"><span data-i18n="panel.seasonOnly">Season Only</span> <button type="button" class="help-tip" data-help="season-only">?</button></span>
              </label>
            </div>
          </div>
          <div id="match-depth-row" class="slider-panel-depth" hidden>
            <label><span data-i18n="set.matchDepth">Match Depth</span>: <span id="match-depth-value">All</span> <button type="button" class="help-tip" data-help="match-depth">?</button></label>
            <input type="range" id="match-depth-slider" min="10" max="200" step="10" value="200">
          </div>
        </div>
      </div>

      <!-- Selected Match Info -->
      <section class="card">
        <div class="results-header">
          <h2 id="selected-match-title">Match Analysis</h2>
          <div class="results-header-actions">
            <button id="close-results" class="close-btn" title="Close" aria-label="Close analysis panel">&times;</button>
          </div>
        </div>
        <p id="match-context" class="context-label" hidden></p>
      </section>

      <!-- Score Matrix -->
      <section class="card">
        <h2><span data-i18n="sec.scoreMatrix">Score Matrix</span> <button type="button" class="help-tip" data-help="score-matrix">?</button></h2>
        <p class="most-likely" id="most-likely-score"></p>
        <div id="score-matrix" class="score-matrix-container"></div>
      </section>

      <!-- Match Outcome -->
      <section class="card">
        <h2><span data-i18n="sec.matchOutcome">Match Outcome</span> <button type="button" class="help-tip" data-help="match-outcome">?</button></h2>
        <div id="match-outcome" class="outcome-bars"></div>
      </section>

      <!-- Over/Under -->
      <section class="card">
        <h2><span data-i18n="sec.overUnder">Over/Under</span> <button type="button" class="help-tip" data-help="over-under">?</button></h2>
        <table id="ou-results" class="results-table"></table>
      </section>

      <!-- Value Bets -->
      <section class="card">
        <h2><span data-i18n="sec.valueBets">Value Bets</span> <button type="button" class="help-tip" data-help="value-bets">?</button></h2>
        <table id="value-bets" class="results-table"></table>
      </section>

      <!-- Fades (Overvalued by Bookmaker) -->
      <section class="card">
        <h2><span data-i18n="sec.fades">Fades</span> <button type="button" class="help-tip" data-help="fades">?</button></h2>
        <table id="fades-table" class="results-table"></table>
      </section>

      <!-- Bookmaker Comparison -->
      <section class="card">
        <h2><span data-i18n="sec.bookmakerComparison">Bookmaker Comparison</span> <button type="button" class="help-tip" data-help="bookmaker-comparison">?</button></h2>
        <div id="bookmaker-comparison"></div>
      </section>

      <!-- All Bets Overview -->
      <section class="card">
        <h2><span data-i18n="sec.allBets">All Bets Overview</span> <button type="button" class="help-tip" data-help="all-bets">?</button></h2>
        <table id="all-bets" class="results-table"></table>
      </section>
    </div>

    <!-- Suggested Bets (cross-league, standalone) -->
    <section id="suggested-bets-section" class="card">
      <div id="suggested-bets-container"></div>
    </section>

    <!-- Standings -->
    <details class="card" id="standings-section">
      <summary><h2 style="display:inline" data-i18n="sec.standings">Standings</h2> <button type="button" class="help-tip" data-help="standings">?</button></summary>
      <div id="standings-container"></div>
      <div id="knockout-results-container"></div>
    </details>

    <!-- Settings (collapsible) -->
    <details class="card">
      <summary><h2 style="display:inline" data-i18n="sec.settings">Settings</h2> <button type="button" class="help-tip" data-help="settings">?</button></summary>
      <div class="setting">
        <label><span data-i18n="set.marketTrust">Market Trust</span>: <span id="market-trust-value">--</span>
          <button type="button" class="help-tip" data-help="market-trust">?</button>
        </label>
        <input type="range" id="market-trust-slider" min="0" max="100" step="1" value="50">
      </div>
      <div class="setting">
        <label><span data-i18n="set.prevSeason">Previous Season</span>: <span id="prev-season-value">--</span>
          <button type="button" class="help-tip" data-help="prev-season">?</button>
        </label>
        <input type="range" id="prev-season-slider" min="0" max="100" step="1" value="50">
      </div>
      <div class="setting">
        <label><span data-i18n="set.lowScoreCorrection">Low-Score Correction</span>: <span id="rho-value">-0.13</span>
          <button type="button" class="help-tip" data-help="rho">?</button>
        </label>
        <input type="range" id="rho-slider" min="-0.30" max="0" step="0.01" value="-0.13">
      </div>
      <div class="setting">
        <label><span data-i18n="set.formBoost">Form Boost</span>: <span id="form-boost-value">3%</span>
          <button type="button" class="help-tip" data-help="form-boost">?</button>
        </label>
        <input type="range" id="form-boost-slider" min="0" max="5" step="1" value="3">
      </div>
      <div class="setting">
        <label><span data-i18n="set.bayesianPrior">Bayesian Prior</span>: <span id="prior-weight-value">5</span>
          <button type="button" class="help-tip" data-help="prior-weight">?</button>
        </label>
        <input type="range" id="prior-weight-slider" min="0" max="15" step="1" value="5">
      </div>
      <div class="setting">
        <label><span data-i18n="set.kellyFraction">Kelly Fraction</span>: <span id="kelly-fraction-value">25%</span>
          <button type="button" class="help-tip" data-help="kelly">?</button>
        </label>
        <input type="range" id="kelly-fraction-slider" min="0.10" max="1.00" step="0.01" value="0.25">
      </div>
      <div class="setting">
        <label><span data-i18n="set.bankroll">Bankroll</span>
          <button type="button" class="help-tip" data-help="bankroll">?</button>
        </label>
        <input type="number" id="bankroll" min="0" step="1" value="1000" placeholder="1000">
      </div>
      <div class="setting">
        <label><span data-i18n="set.minEdge">Min. Edge</span>: <span id="edge-threshold-value">3%</span>
          <button type="button" class="help-tip" data-help="edge-threshold">?</button>
        </label>
        <input type="range" id="edge-threshold-slider" min="0" max="15" step="1" value="3">
      </div>
    </details>

    <!-- Season P/L Simulation -->
    <details class="card">
      <summary><h2 style="display:inline" data-i18n="sec.plSimulation">Season P/L Simulation</h2> <button type="button" class="help-tip" data-help="pl-simulation">?</button></summary>
      <div id="pl-container"></div>
    </details>

    <!-- Prediction Tracker -->
    <details class="card">
      <summary><h2 style="display:inline" data-i18n="sec.predictionTracker">Prediction Tracker</h2> <button type="button" class="help-tip" data-help="prediction-tracker">?</button></summary>
      <div id="tracker-container"></div>
    </details>

    <!-- Elo Ratings -->
    <details class="card">
      <summary><h2 style="display:inline" data-i18n="sec.eloRatings">Elo Ratings</h2> <button type="button" class="help-tip" data-help="elo-ratings">?</button></summary>
      <div id="elo-table"></div>
    </details>

    <!-- Help Modal -->
    <div id="help-modal" class="help-modal hidden" role="dialog" aria-modal="true" aria-labelledby="help-modal-title">
      <div class="help-modal-backdrop"></div>
      <div class="help-modal-content">
        <div class="help-modal-header">
          <h3 id="help-modal-title"></h3>
          <button class="help-modal-close" id="help-modal-close" aria-label="Close help">&times;</button>
        </div>
        <div id="help-modal-body" class="help-modal-body"></div>
      </div>
    </div>

  </div>

  <script type="module" src="js/app.js?v=1787772315"></script>
</body>
</html>
